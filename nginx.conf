# Configuración de nginx para servir el sitio estático (equivale a vercel.json).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Compresión de texto
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json application/xml image/svg+xml;

    # Cabeceras de seguridad (se aplican a todas las respuestas, incluidos los errores)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /404 { return 404; }

    # URLs limpias: /privacidad en vez de /privacidad.html, y / en vez de /index.html.
    # Se usa $request_uri (la petición original) para no entrar en bucle con la redirección interna a index.html.
    if ($request_uri ~ ^/index\.html$) { return 301 /; }
    if ($request_uri ~ ^/(?!404\.html)(.+?)\.html(\?.*)?$) { return 301 /$1$is_args$args; }

    # HTML: siempre revalidar
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }

    # Imágenes y fuentes: caché de 30 días
    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    location = /favicon.ico        { expires 1d; }
    location = /site.webmanifest   { expires 1d; default_type application/manifest+json; }
    location = /og-huachipato.jpg  { expires 1d; }

    # Archivos ocultos y de configuración nunca se sirven
    location ~ ^/(\.|Dockerfile|nginx\.conf|vercel\.json|README\.md) { return 404; }
}
